# Grimoire book configuration for the @deckyard/epub documentation.

[book]
title = "@deckyard/epub"
description = "Read and write EPUB books: metadata, chapters, table of contents, images and styles"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "grimoire"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-epub/"
repoUrl = "https://github.com/deckyard/deck-epub"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-epub/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
